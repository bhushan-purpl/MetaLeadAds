<template>
    <lightning-card title="Purplstack License Manager" icon-name="custom:custom43">
        <div class="slds-m-around_medium">
            
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <!-- ⚠️ Expiring Soon Warning Banner (Orange) -->
            <template if:true={isExpiringSoon}>
                <div class="banner banner-warning slds-m-bottom_medium">
                    <div class="banner-icon">⚠️</div>
                    <div class="banner-content">
                        <strong>Your Purplstack Meta Lead Manager license will expire in {daysText}.</strong>
                        <p>Please renew and activate a new license before the expiry date to avoid service interruption.</p>
                    </div>
                </div>
            </template>

            <!-- ⚠️ Expired Warning Banner (Red) -->
            <template if:true={isExpired}>
                <div class="banner banner-error slds-m-bottom_medium">
                    <div class="banner-icon">⚠️</div>
                    <div class="banner-content">
                        <strong>Your license has expired.</strong>
                        <p>Please enter a valid activation key below to continue using Purplstack Meta Lead Manager.</p>
                    </div>
                </div>
            </template>

            <!-- Status Section Card -->
            <div class="license-card slds-m-bottom_medium">
                <div class="license-card-header">
                    <span class="card-title">Current License Status</span>
                    <span class={statusBadgeClass}>
                        {statusIcon} {licenseStatus}
                    </span>
                </div>
                
                <div class="license-card-body">
                    <div class="info-row">
                        <span class="info-label">Status:</span>
                        <span class="info-value"><strong>{licenseStatus}</strong></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Expires:</span>
                        <span class="info-value"><strong>{licenseExpiry}</strong></span>
                    </div>
                    <template if:false={isExpired}>
                        <div class="info-row">
                            <span class="info-label">Remaining Days:</span>
                            <span class="info-value"><strong>{daysText}</strong></span>
                        </div>
                    </template>
                    <div class="info-row">
                        <span class="info-label">Page Mapping Limit:</span>
                        <span class="info-value"><strong>{maxPages}</strong></span>
                    </div>
                    <template if:true={licenseKey}>
                        <div class="info-row">
                            <span class="info-label">Current Key:</span>
                            <span class="info-value"><code>{licenseKey}</code></span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Activation Section (Always Enabled) -->
            <div class="activation-card">
                <p class="card-title slds-m-bottom_small">Activate New License</p>
                
                <lightning-input 
                    type="text" 
                    label="Activation Key" 
                    value={inputKey} 
                    onchange={handleKeyChange}
                    placeholder="Enter your KEY-XXXXXXXXXXXX key"
                    class="slds-m-bottom_small">
                </lightning-input>
                
                <lightning-button 
                    label="Validate & Activate" 
                    variant="brand" 
                    onclick={handleActivate}
                    disabled={isActivateDisabled}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
