<template>
    <article class="slds-card">
        <div class="slds-m-around_medium">
            
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <!-- ⚠️ Expiring Soon Warning Banner (Orange) -->
            <template if:true={isExpiringSoon}>
                <div class="banner banner-warning slds-m-bottom_medium">
                    <div class="banner-icon">⚠️</div>
                    <div class="banner-content">
                        <strong>Your PurplSync Meta Lead Manager license will expire in {daysText}.</strong>
                        <p>Please renew and activate a new license before the expiry date to avoid service interruption.</p>
                        <p class="slds-m-top_x-small"><strong>Renewal Contact:</strong> Pradeep Bijur &nbsp;|&nbsp; 📞 <a href="tel:9880932480">9880932480</a> &nbsp;|&nbsp; ✉️ <a href="mailto:pradeep.bijur@purplstack.com">pradeep.bijur@purplstack.com</a></p>
                    </div>
                </div>
            </template>

            <!-- ⚠️ Expired Warning Banner (Red) -->
            <template if:true={isExpired}>
                <div class="banner banner-error slds-m-bottom_medium">
                    <div class="banner-icon">⚠️</div>
                    <div class="banner-content">
                        <strong>Your license has expired.</strong>
                        <p>Please contact <strong>Pradeep Bijur</strong> for renewal, or enter a valid activation key below to continue using PurplSync Meta Lead Manager.</p>
                        <p class="slds-m-top_x-small">📞 <strong>Phone:</strong> <a href="tel:9880932480">9880932480</a> &nbsp;|&nbsp; ✉️ <strong>Email:</strong> <a href="mailto:pradeep.bijur@purplstack.com">pradeep.bijur@purplstack.com</a></p>
                    </div>
                </div>
            </template>

            <!-- Status Section Card -->
            <div class="license-card slds-m-bottom_medium">
                <div class="license-card-header">
                    <span class="card-title">Current License Status</span>
                    <span class={statusBadgeClass}>
                        {statusIcon} {licenseStatus}
                    </span>
                </div>
                
                <div class="license-card-body">
                    <div class="license-card-grid">
                        <!-- Left Side: License Details -->
                        <div class="license-info-column">
                            <div class="info-row">
                                <span class="info-label">Status:</span>
                                <span class="info-value"><strong>{licenseStatus}</strong></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Expires:</span>
                                <span class="info-value"><strong>{licenseExpiry}</strong></span>
                            </div>
                            <template if:false={isExpired}>
                                <div class="info-row">
                                    <span class="info-label">Remaining Days:</span>
                                    <span class="info-value"><strong>{daysText}</strong></span>
                                </div>
                            </template>
                            <div class="info-row">
                                <span class="info-label">Page Mapping Limit:</span>
                                <span class="info-value"><strong>{maxPages}</strong></span>
                            </div>
                            <template if:true={licenseKey}>
                                <div class="info-row">
                                    <span class="info-label">Current Key:</span>
                                    <span class="info-value"><code>{licenseKey}</code></span>
                                </div>
                            </template>
                        </div>

                        <!-- Right Side: Renewal Contact Card (When Expired) -->
                        <template if:true={isExpired}>
                            <div class="renewal-contact-card">
                                <div class="contact-header">
                                    <span class="contact-icon">📞</span> Contact for License Renewal
                                </div>
                                <div class="contact-body">
                                    <div class="contact-row">
                                        <span class="contact-label">Contact Person:</span>
                                        <span class="contact-value"><strong>Pradeep Bijur</strong></span>
                                    </div>
                                    <div class="contact-row">
                                        <span class="contact-label">Phone:</span>
                                        <span class="contact-value"><a href="tel:9880932480"><strong>9880932480</strong></a></span>
                                    </div>
                                    <div class="contact-row">
                                        <span class="contact-label">Email:</span>
                                        <span class="contact-value"><a href="mailto:pradeep.bijur@purplstack.com"><strong>pradeep.bijur@purplstack.com</strong></a></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Activation Section (Always Enabled) -->
            <div class="activation-card">
                <p class="card-title slds-m-bottom_small">Activate New License</p>
                
                <lightning-input 
                    type="text" 
                    label="Activation Key" 
                    value={inputKey} 
                    onchange={handleKeyChange}
                    placeholder="Enter your KEY-XXXXXXXXXXXX key"
                    class="slds-m-bottom_small">
                </lightning-input>
                
                <lightning-button 
                    label="Validate & Activate" 
                    variant="brand" 
                    onclick={handleActivate}
                    disabled={isActivateDisabled}>
                </lightning-button>
            </div>

        </div>
    </article>
</template>
