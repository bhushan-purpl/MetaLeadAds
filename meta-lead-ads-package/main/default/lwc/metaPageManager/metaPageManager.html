<template>
    <div class="page-manager-container">
        <!-- Header -->
        <div class="pm-header">
            <div class="pm-title-group">
                <div class="pm-icon-ring">
                    <lightning-icon icon-name="utility:socialshare" size="small"></lightning-icon>
                </div>
                <div>
                    <h1 class="pm-title">Facebook Pages</h1>
                    <p class="pm-subtitle">Manage connected pages and sync lead forms</p>
                </div>
            </div>
            <div class="pm-actions">
                <lightning-button label="Sync Pages" icon-name="utility:refresh" variant="brand" onclick={handleSyncPages} disabled={isLoading}></lightning-button>
            </div>
        </div>

        <!-- Stats row -->
        <div class="stats-row">
            <div class="stat-card">
                <span class="stat-num">{totalPages}</span>
                <span class="stat-lbl">Total Pages</span>
            </div>
            <div class="stat-card">
                <span class="stat-num">{connectedPages}</span>
                <span class="stat-lbl">Connected</span>
            </div>
            <div class="stat-card">
                <span class="stat-num">{totalForms}</span>
                <span class="stat-lbl">Forms Synced</span>
            </div>
        </div>

        <template if:true={isLoading}>
            <div class="loading-wrap">
                <lightning-spinner alternative-text="Loading pages..." size="medium"></lightning-spinner>
                <p class="loading-text">Syncing from Meta...</p>
            </div>
        </template>

        <!-- Page Cards -->
        <template if:false={isLoading}>
            <template if:true={hasPages}>
                <div class="page-list-header">
                    <div class="plh-col plh-name">Page Name</div>
                    <div class="plh-col plh-status">Status</div>
                    <div class="plh-col plh-forms">Forms</div>
                    <div class="plh-col plh-actions">Actions</div>
                </div>
                <div class="page-list">
                    <template for:each={pages} for:item="page">
                        <div key={page.Id} class="page-list-item" onclick={handlePageClick} data-id={page.Page_ID} data-name={page.Page_Name}>
                            <div class="pli-col pli-name">
                                <div class="page-avatar">
                                    <span class="avatar-initials">{page.initials}</span>
                                </div>
                                <div class="page-info">
                                    <h3 class="page-name">{page.Page_Name}</h3>
                                    <p class="page-id">ID: {page.Page_ID}</p>
                                </div>
                            </div>
                            <div class="pli-col pli-status">
                                <span class={page.statusClass}>{page.Status}</span>
                            </div>
                            <div class="pli-col pli-forms">
                                <span class="forms-badge">{page.Forms_Count} Forms</span>
                            </div>
                            <div class="pli-col pli-actions">
                                <lightning-button-icon icon-name="utility:settings" variant="bare" size="medium" class="action-btn"></lightning-button-icon>
                                <lightning-button-icon icon-name="utility:threedots" variant="bare" size="medium" class="action-btn slds-m-left_x-small"></lightning-button-icon>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasPages}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:socialshare" size="large"></lightning-icon>
                    <h3>No pages connected yet</h3>
                    <p>Click "Sync Pages" to fetch your Facebook pages</p>
                </div>
            </template>
        </template>

        <template if:true={errorMessage}>
            <div class="error-box">{errorMessage}</div>
        </template>
    </div>
</template>
